<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-label="UERANSIM 模块结构图">
  <style>
    .bg { fill: #F7F7F8; }
    .card { fill: #FFFFFF; stroke: #E4E4E7; stroke-width: 1; }
    .card-dash { fill: #FFFFFF; stroke: #D4D4D8; stroke-width: 1; stroke-dasharray: 4 4; }
    .focal { fill: #F2F7FF; stroke: #4B3FE3; stroke-width: 1.5; }
    .title { fill: #171717; font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif; font-size: 24px; font-weight: 600; }
    .subtitle { fill: #71717A; font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif; font-size: 13px; }
    .layer { fill: #71717A; font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif; font-size: 13px; font-weight: 500; }
    .node { fill: #171717; font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif; font-size: 16px; font-weight: 500; }
    .node-sm { fill: #171717; font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif; font-size: 15px; font-weight: 500; }
    .desc { fill: #52525B; font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif; font-size: 12px; }
    .desc-brand { fill: #3C2ECA; font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif; font-size: 12px; }
    .chip { fill: #F4F4F5; stroke: #E4E4E7; stroke-width: 1; }
    .chip-t { fill: #3F3F46; font-family: "SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; font-size: 12px; }
    .arrow { stroke: #A1A1AA; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .foot { fill: #71717A; font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif; font-size: 12px; }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="790"/>

  <text class="title" x="40" y="52">UERANSIM 模块结构</text>
  <text class="subtitle" x="40" y="78">v3.3.0 · 4f45e18 · 四层结构：可执行程序 / 网元库 / 公共库 / 基础库</text>

  <!-- ① 可执行程序 -->
  <text class="layer" x="40" y="116">① 可执行程序</text>

  <rect class="card" x="40" y="130" width="180" height="64" rx="12"/>
  <text class="node-sm" x="130" y="158" text-anchor="middle">nr-gnb</text>
  <text class="desc" x="130" y="179" text-anchor="middle">gNB 进程</text>

  <rect class="card" x="250" y="130" width="180" height="64" rx="12"/>
  <text class="node-sm" x="340" y="158" text-anchor="middle">nr-ue</text>
  <text class="desc" x="340" y="179" text-anchor="middle">UE 进程</text>

  <rect class="card" x="460" y="130" width="180" height="64" rx="12"/>
  <text class="node-sm" x="550" y="158" text-anchor="middle">nr-cli</text>
  <text class="desc" x="550" y="179" text-anchor="middle">控制命令行</text>

  <rect class="card" x="670" y="130" width="240" height="64" rx="12"/>
  <text class="node-sm" x="790" y="158" text-anchor="middle">nr-binder</text>
  <text class="desc" x="790" y="179" text-anchor="middle">libdevbnd.so（LD_PRELOAD）</text>

  <rect class="card-dash" x="940" y="130" width="220" height="64" rx="12"/>
  <text class="node-sm" x="1050" y="158" text-anchor="middle">config/*.yaml</text>
  <text class="desc" x="1050" y="179" text-anchor="middle">gNB / UE 配置输入</text>

  <!-- arrows row1 -> row2 -->
  <path class="arrow" d="M250 194 V240" marker-end="url(#ar)"/>
  <path class="arrow" d="M710 194 V240" marker-end="url(#ar)"/>
  <path class="arrow" d="M1060 194 V240" marker-end="url(#ar)"/>

