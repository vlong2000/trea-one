  <text class="node" x="64" y="274">gNB</text>
  <text class="desc" x="64" y="296">6 个 NTS 任务</text>
  <rect class="chip" x="64" y="316" width="52" height="26" rx="13"/>
  <text class="chip-t" x="90" y="334" text-anchor="middle">app</text>
  <rect class="chip" x="128" y="316" width="60" height="26" rx="13"/>
  <text class="chip-t" x="158" y="334" text-anchor="middle">sctp</text>
  <rect class="chip" x="200" y="316" width="60" height="26" rx="13"/>
  <text class="chip-t" x="230" y="334" text-anchor="middle">ngap</text>
  <rect class="chip" x="272" y="316" width="54" height="26" rx="13"/>
  <text class="chip-t" x="299" y="334" text-anchor="middle">rrc</text>
  <rect class="chip" x="338" y="316" width="54" height="26" rx="13"/>
