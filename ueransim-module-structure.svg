  <rect class="chip" x="404" y="316" width="54" height="26" rx="13"/>
  <text class="chip-t" x="431" y="334" text-anchor="middle">rls</text>
  <text class="desc" x="64" y="374">N2 控制面 + N3 用户面 + 模拟空口</text>

  <rect class="card" x="620" y="240" width="540" height="166" rx="12"/>
  <text class="node" x="644" y="274">UE</text>
  <text class="desc" x="644" y="296">4 个常驻任务 + 每会话 TUN</text>
  <rect class="chip" x="644" y="316" width="52" height="26" rx="13"/>
  <text class="chip-t" x="670" y="334" text-anchor="middle">app</text>
  <rect class="chip" x="708" y="316" width="52" height="26" rx="13"/>
  <text class="chip-t" x="734" y="334" text-anchor="middle">nas</text>
  <rect class="chip" x="772" y="316" width="54" height="26" rx="13"/>
  <text class="chip-t" x="799" y="334" text-anchor="middle">rrc</text>
  <rect class="chip" x="838" y="316" width="54" height="26" rx="13"/>
  <text class="chip-t" x="865" y="334" text-anchor="middle">rls</text>
  <rect class="chip" x="904" y="316" width="54" height="26" rx="13"/>
  <text class="chip-t" x="931" y="334" text-anchor="middle">tun</text>
  <text class="desc" x="644" y="374">NAS 状态机 + TUN 用户面（每 PDU 会话一个实例）</text>

  <!-- arrows row2 -> row3 -->
  <path class="arrow" d="M250 406 V474" marker-end="url(#ar)"/>
  <path class="arrow" d="M710 406 V474" marker-end="url(#ar)"/>
  <path class="arrow" d="M1060 406 V474" marker-end="url(#ar)"/>

  <!-- ③ 公共库 -->
  <text class="layer" x="40" y="462">③ 公共库</text>

  <rect class="card" x="40" y="474" width="1120" height="94" rx="12"/>
  <text class="node" x="64" y="510">common-lib</text>
  <text class="desc" x="64" y="532">gNB / UE 共享</text>
  <rect class="chip" x="260" y="508" width="52" height="26" rx="13"/>
  <text class="chip-t" x="286" y="526" text-anchor="middle">app</text>
  <rect class="chip" x="324" y="508" width="48" height="26" rx="13"/>
  <text class="chip-t" x="348" y="526" text-anchor="middle">asn</text>
  <rect class="chip" x="384" y="508" width="56" height="26" rx="13"/>
  <text class="chip-t" x="412" y="526" text-anchor="middle">crypt</text>
  <rect class="chip" x="452" y="508" width="52" height="26" rx="13"/>
  <text class="chip-t" x="478" y="526" text-anchor="middle">nas</text>
  <rect class="chip" x="516" y="508" width="52" height="26" rx="13"/>
  <text class="chip-t" x="542" y="526" text-anchor="middle">rlc</text>
  <rect class="chip" x="580" y="508" width="52" height="26" rx="13"/>
  <text class="chip-t" x="606" y="526" text-anchor="middle">rls</text>
  <rect class="chip" x="644" y="508" width="52" height="26" rx="13"/>
  <text class="chip-t" x="670" y="526" text-anchor="middle">rrc</text>
  <rect class="chip" x="708" y="508" width="52" height="26" rx="13"/>
  <text class="chip-t" x="734" y="526" text-anchor="middle">sctp</text>
  <rect class="chip" x="772" y="508" width="52" height="26" rx="13"/>
  <text class="chip-t" x="798" y="526" text-anchor="middle">udp</text>
  <text class="desc" x="260" y="552">CLI · ASN.1 · 加密 · NAS · RLC · RRC · SCTP · UDP</text>

  <!-- arrows row3 -> row4 -->
  <path class="arrow" d="M250 568 V620" marker-end="url(#ar)"/>
  <path class="arrow" d="M710 568 V620" marker-end="url(#ar)"/>
  <path class="arrow" d="M1060 568 V620" marker-end="url(#ar)"/>

  <!-- ④ 基础层 -->
  <text class="layer" x="40" y="606">④ 基础层</text>

  <rect class="focal" x="40" y="620" width="420" height="104" rx="12"/>
  <text class="node" x="64" y="654" fill="#1A1759">utils · NTS</text>
  <text class="desc-brand" x="64" y="678">任务 · 消息队列 · 定时器</text>
  <text class="desc-brand" x="64" y="700">NtsMessage 是层间唯一通信方式</text>

  <rect class="card" x="500" y="620" width="420" height="104" rx="12"/>
  <text class="node" x="524" y="654">ext</text>
  <text class="desc" x="524" y="678">spdlog · yaml-cpp</text>
  <text class="desc" x="524" y="700">micro-ecc · compact25519 · crypt-ext · doctest</text>

  <rect class="card" x="960" y="620" width="200" height="104" rx="12"/>
  <text class="node" x="984" y="654">asn / asn1c</text>
  <text class="desc" x="984" y="678">NGAP 16 MB</text>
  <text class="desc" x="984" y="700">RRC 11 MB</text>

  <text class="foot" x="40" y="762">箭头表示编译期依赖；运行时 gNB / UE 内部通过 NTS 消息协作 · 源码 4306 个文件 / 39 MB</text>
